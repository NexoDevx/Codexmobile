name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codemobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Testar e compilar CodeMobile
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java compatível com Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar ferramentas e configuração
        shell: bash
        run: |
          set -Eeuo pipefail
          node --version
          npm --version
          java -version
          test -f package.json
          test -f capacitor.config.json
          test -d www
          test -f native/setup-linux.sh
          test -f native/setup-folder.sh
          test -f native/setup-download.sh
          test -f native/ShellPlugin.java
          bash -n native/setup-linux.sh
          bash -n native/setup-folder.sh
          bash -n native/setup-download.sh

      - name: Instalar dependências JavaScript
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Testes obrigatórios de downloads, pastas, importação e Linux
        shell: bash
        run: node --test test/native-output.test.mjs test/carga.test.mjs test/imports.test.mjs test/proot-runtime.test.mjs

      - name: Biblioteca de IA local (opcional)
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @wllama/wllama@2.3.7
          mkdir -p www/llm
          cp -r node_modules/@wllama/wllama/esm www/llm/esm
          test -d www/llm/esm

      - name: Suíte completa de testes
        shell: bash
        run: npm test

      - name: Criar projeto Android
        shell: bash
        run: |
          set -Eeuo pipefail
          npx cap add android
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Permissões Android e carregamento das bibliotecas nativas
        shell: bash
        run: |
          set -Eeuo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            sed -i '/<manifest[ >]/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST"
          fi
          if grep -q '<application' "$MANIFEST"; then
            if ! grep -q 'android:usesCleartextTraffic=' "$MANIFEST"; then
              sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            fi
            if ! grep -q 'android:extractNativeLibs=' "$MANIFEST"; then
              sed -i 's/<application/<application android:extractNativeLibs="true"/' "$MANIFEST"
            fi
          else
            echo 'Manifesto Android sem tag <application>' >&2
            exit 1
          fi
          grep -q 'ACCESS_NETWORK_STATE' "$MANIFEST"
          grep -q 'extractNativeLibs="true"' "$MANIFEST"

      - name: Baixar e validar proroot + Ubuntu Base ARM64
        shell: bash
        env:
          PROROOT_VERSION: v1.2.8
          UBUNTU_BASE_VERSION: 24.04.5
        run: |
          set -Eeuo pipefail
          bash native/setup-linux.sh
          test -s android/app/src/main/assets/rootfs.bin
          test -s android/app/src/main/assets/linux-engine-info.txt
          test -s android/app/src/main/assets/proroot-LICENSE.txt
          for lib in \
            libproroot.so \
            libproroot-runtime.so \
            libproroot-bridge.so \
            libproroot-linker.so \
            libproroot-stub-loader.so; do
            test -s "android/app/src/main/jniLibs/arm64-v8a/$lib"
          done
          grep -q '^engine=proroot$' android/app/src/main/assets/linux-engine-info.txt
          grep -q '^rootfs=Ubuntu Base 24.04.5 ARM64$' android/app/src/main/assets/linux-engine-info.txt

      - name: Preparar plugins nativos de arquivos e downloads
        shell: bash
        run: |
          set -Eeuo pipefail
          bash native/setup-folder.sh
          bash native/setup-download.sh
          test -s android/app/src/main/java/com/codemobile/app/FolderPlugin.java
          test -s android/app/src/main/java/com/codemobile/app/DownloadPlugin.java
          test -s android/app/src/main/java/com/codemobile/app/ShellPlugin.java
          test -s android/app/src/main/java/com/codemobile/app/MainActivity.java

      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -Eeuo pipefail
          npx cap sync android
          test -d android/app/src/main/assets

      - name: Preservar símbolos e bibliotecas do proroot
        shell: bash
        run: |
          set -Eeuo pipefail
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              packagingOptions {
                  jniLibs {
                      keepDebugSymbols += [
                          "**/libproroot.so",
                          "**/libproroot-runtime.so",
                          "**/libproroot-bridge.so",
                          "**/libproroot-linker.so",
                          "**/libproroot-stub-loader.so"
                      ]
                  }
              }
          }
          GRADLE

      - name: Compilar APK de depuração
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verificar APK, plugins, rootfs e hashes dos binários
        shell: bash
        run: |
          set -Eeuo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo '::error::APK não foi gerado'; exit 1; }
          unzip -t "$APK" >/dev/null

          for c in FolderPlugin DownloadPlugin ShellPlugin; do
            if unzip -p "$APK" 'classes*.dex' | grep -aq "$c"; then
              echo "OK: $c incluído"
            else
              echo "::error::$c ausente do APK"
              exit 1
            fi
          done

          declare -A SHA=(
            [libproroot.so]=a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01
            [libproroot-runtime.so]=8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34
            [libproroot-bridge.so]=1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f
            [libproroot-linker.so]=51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee
            [libproroot-stub-loader.so]=06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0
          )
          for f in "${!SHA[@]}"; do
            p="lib/arm64-v8a/$f"
            unzip -Z1 "$APK" | grep -Fxq "$p" || { echo "::error::$p ausente"; exit 1; }
            got="$(unzip -p "$APK" "$p" | sha256sum | awk '{print $1}')"
            [[ "$got" == "${SHA[$f]}" ]] || { echo "::error::SHA-256 inválido para $f: $got"; exit 1; }
            echo "OK: SHA-256 $f"
          done

          unzip -Z1 "$APK" | grep -Fxq 'assets/rootfs.bin' || { echo '::error::rootfs Ubuntu ausente'; exit 1; }
          unzip -p "$APK" assets/linux-engine-info.txt | grep -Fxq 'engine=proroot' || { echo '::error::marcador proroot ausente'; exit 1; }
          unzip -p "$APK" assets/linux-engine-info.txt | grep -Fxq 'rootfs=Ubuntu Base 24.04.5 ARM64' || { echo '::error::marcador Ubuntu incorreto'; exit 1; }
          unzip -p "$APK" assets/proroot-LICENSE.txt | grep -q 'Copyright (c) 2026 coderred' || { echo '::error::licença proroot ausente'; exit 1; }
          if unzip -Z1 "$APK" | grep -Eq 'lib/arm64-v8a/libproot(-loader)?\.so'; then
            echo '::error::runtime PRoot antigo encontrado junto do proroot'
            exit 1
          fi
          for f in downloads.js ext2.js pkg.js reserva.js nucleo.js; do
            unzip -Z1 "$APK" | grep -Fq "assets/public/$f" || { echo "::error::$f não incluído"; exit 1; }
            echo "OK: $f incluído"
          done
          sha256sum "$APK"

      - name: Publicar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: CodeMobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
