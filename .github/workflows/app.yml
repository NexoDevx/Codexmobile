name: Build APK
on: {push: {branches: [main]}, workflow_dispatch: {}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Regressões obrigatórias de downloads, pastas, importação e Linux
        run: node --test test/native-output.test.mjs test/carga.test.mjs test/imports.test.mjs test/proot-runtime.test.mjs
      - name: Biblioteca de IA local (wllama) - opcional, o app usa a CDN se falhar
        continue-on-error: true
        run: |
          npm install --no-save @wllama/wllama@2.3.7
          mkdir -p www/llm && cp -r node_modules/@wllama/wllama/esm www/llm/esm
          ls -la www/llm/esm | head
      - name: Suíte completa obrigatória
        run: npm test
      - run: npx cap add android
      - name: Permissões do Android para rede e Linux
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:extractNativeLibs="true"/' android/app/src/main/AndroidManifest.xml
      - name: Linux via proroot + Ubuntu Base (obrigatório)
        env:
          PROROOT_VERSION: v1.2.8
          UBUNTU_BASE_VERSION: 24.04.5
        run: |
          bash -n native/setup-linux.sh
          bash native/setup-linux.sh
      - name: Plugins essenciais de armazenamento (obrigatórios)
        run: |
          bash native/setup-folder.sh
          bash native/setup-download.sh
      - run: npx cap sync android
      - name: Preservar os binários proroot originais no APK
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              packagingOptions {
                  jniLibs {
                      keepDebugSymbols += ["**/libproroot.so", "**/libproroot-runtime.so", "**/libproroot-bridge.so", "**/libproroot-linker.so", "**/libproroot-stub-loader.so"]
                  }
              }
          }
          GRADLE
      - name: Build APK (falha se Linux ou componentes obrigatórios faltarem)
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon assembleDebug)
      - name: Verificar plugins, runtime, rootfs e integridade dos binários no APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || { echo "::error::O APK não foi gerado"; exit 1; }
          for c in FolderPlugin DownloadPlugin ShellPlugin; do
            if unzip -p "$APK" 'classes*.dex' | grep -aq "$c"; then echo "✅ $c está no APK"
            else echo "::error::$c ausente no APK"; exit 1; fi
          done
          declare -A SHA=(
            [libproroot.so]=a4e74d75b66cdc02b080adfe863dbf9951c3b30610d77beddc95488d5fe5de01
            [libproroot-runtime.so]=8c47a0a7db32d84c179ebb5bf3640f655a3181860ece5886ae44d92858730c34
            [libproroot-bridge.so]=1c5bc9537a270e8bf8b1c70222813f57b60b828bfb5503ddf8fe37685092de2f
            [libproroot-linker.so]=51a0ec5bfed00e572a0de09e22d9057e2befc386b78e426613d3e0ab03f4ecee
            [libproroot-stub-loader.so]=06c6624db3bdc45b9ced151cd781df439a37b47731d244b93e9d6a58cd48cde0
          )
          for f in "${!SHA[@]}"; do
            p="lib/arm64-v8a/$f"
            unzip -l "$APK" | grep -Fq "$p" || { echo "::error::$p ausente no APK"; exit 1; }
            got="$(unzip -p "$APK" "$p" | sha256sum | awk '{print $1}')"
            [ "$got" = "${SHA[$f]}" ] || { echo "::error::SHA-256 no APK inválido para $f ($got)"; exit 1; }
            echo "✅ SHA-256 $f"
          done
          unzip -l "$APK" | grep -q 'assets/rootfs.bin' || { echo "::error::Ubuntu Base rootfs ausente no APK"; exit 1; }
          unzip -p "$APK" assets/linux-engine-info.txt | grep -q 'engine=proroot' || { echo "::error::Marcador de runtime incorreto"; exit 1; }
          unzip -p "$APK" assets/linux-engine-info.txt | grep -q 'rootfs=Ubuntu Base 24.04.5 ARM64' || { echo "::error::Marcador Ubuntu Base incorreto"; exit 1; }
          unzip -p "$APK" assets/proroot-LICENSE.txt | grep -q 'Copyright (c) 2026 coderred' || { echo "::error::Licença proroot não incluída no APK"; exit 1; }
          if unzip -l "$APK" | grep -Eq 'lib/arm64-v8a/libproot(-loader)?\.so'; then echo "::error::Binário legado PRoot encontrado no APK"; exit 1; fi
          for f in downloads.js ext2.js pkg.js reserva.js nucleo.js; do
            if unzip -l "$APK" | grep -q "assets/public/$f"; then echo "✅ $f está no APK"; else echo "::error::$f não foi incluído"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with: {name: CodeMobile-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
